name = "ravi-portfolio"
main = "src/worker/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets Binding (Serves built Vite frontend from ./dist)
assets = { directory = "./dist", binding = "ASSETS" }

# Cloudflare D1 Unified Storage Binding (Payment-free serverless SQLite)
[[d1_databases]]
binding = "DB"
database_name = "ravi-portfolio-db"
database_id = "43cb626e-017f-4b4b-b563-e9c5308c5b27"
migrations_dir = "migrations"

# Cloudflare Native Workers Rate Limiting Binding (Free Tier)
# 5 requests per 60 seconds per client
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
ENVIRONMENT = "production"
PUBLIC_DOMAIN = "ravi-portfolio.dsecops88.online"
CF_ACCESS_TEAM_DOMAIN = "https://dsecops88.cloudflareaccess.com"
CF_ACCESS_OWNER_EMAIL = "dasariravid145@gmail.com"
RESEND_FROM_EMAIL = "Ravi Dasari <contact@dsecops88.online>"
CONTACT_DELIVERY_EMAIL = "dasariravid145@gmail.com"

[env.development]
vars = { ENVIRONMENT = "development", PUBLIC_DOMAIN = "localhost:8787", CF_ACCESS_TEAM_DOMAIN = "https://dsecops88.cloudflareaccess.com", CF_ACCESS_OWNER_EMAIL = "dasariravid145@gmail.com", RESEND_FROM_EMAIL = "Ravi Dasari <contact@dsecops88.online>", CONTACT_DELIVERY_EMAIL = "dasariravid145@gmail.com" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "ravi-portfolio-db"
database_id = "43cb626e-017f-4b4b-b563-e9c5308c5b27"
migrations_dir = "migrations"

[[env.development.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }


